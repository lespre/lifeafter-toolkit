  }

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setClearColor(0x0e1014, 1);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1a1c22, 1.35));
const k1 = new THREE.DirectionalLight(0xfff2e0, 2.1); k1.position.set(4,7,6); scene.add(k1);
const k2 = new THREE.DirectionalLight(0x88aaff, 1.15); k2.position.set(-6,3,-5); scene.add(k2);
const k3 = new THREE.DirectionalLight(0xffc070, 0.7); k3.position.set(-2,-4,4); scene.add(k3);
const grid = new THREE.GridHelper(24, 24, 0x2a3140, 0x1b1f26); grid.position.y = -1; scene.add(grid);

const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 2000);
let target = new THREE.Vector3(0,0,0), dist = 30, theta = 0.35, phi = 1.35, cur = null;
// 视角参数：?view=back|front|left|right（默认 front-ish）
(function(){
  const v = new URLSearchParams(location.search).get('view');
  if (v === 'back'){ theta = Math.PI; phi = 1.35; }
  else if (v === 'front'){ theta = 0; phi = 1.35; }
  else if (v === 'left'){ theta = -Math.PI/2; phi = 1.35; }
  else if (v === 'right'){ theta = Math.PI/2; phi = 1.35; }
})();

function fit(){
  const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
  cam.aspect = w / h;
  cam.position.set(target.x + dist*Math.sin(phi)*Math.sin(theta),
                   target.y + dist*Math.cos(phi),
                   target.z + dist*Math.sin(phi)*Math.cos(theta));
  cam.lookAt(target); cam.updateProjectionMatrix();
}
function render(){ renderer.setSize(canvas.clientWidth, canvas.clientHeight, false); fit(); renderer.render(scene, cam); }

function load(name, label){
  if (cur){ scene.remove(cur); cur = null; }
  document.getElementById('hud').textContent = label || '';
  new GLTFLoader().load('./assets/3d/weapon_skin/' + name, (g) => {
    const o = g.scene; o.rotation.x = Math.PI;
    o.traverse(n => { if (n.isMesh && n.material){
      const ms = Array.isArray(n.material)?n.material:[n.material];
      for (const mm of ms){ mm.side = THREE.DoubleSide;
        mm.color = new THREE.Color(0xc8ccd4); mm.roughness = 0.72; mm.metalness = 0.06;
        mm.needsUpdate = true; } } });
    scene.add(o); o.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(o);
    const c = box.getCenter(new THREE.Vector3()); o.position.sub(c);
    const s = box.getSize(new THREE.Vector3());
    const r = Math.max(s.x,s.y,s.z) * 0.62;
    target.set(0,0,0);
    // 竖屏手机留更大边距
    const portrait = canvas.clientWidth < canvas.clientHeight;
    dist = r / Math.tan((cam.fov*Math.PI/180)/2) * (portrait ? 1.85 : 1.45);
    cur = o; render(); window.__loaded = (window.__loaded||0)+1;
  }, undefined, (e)=>{ window.__err = String(e); });
}

// 侧栏
const list = document.getElementById('list');
const body = document.body;
let first = null;
for (const g of GROUPS){
  const h = document.createElement('h3'); h.textContent = g.g; list.appendChild(h);
  for (const it of g.items){
    const d = document.createElement('div'); d.className = 'it'; d.textContent = it.label;
    if (it.href){
      d.classList.add('ext');
      d.onclick = () => { window.location.href = it.href; };
    } else {
      d.onclick = () => { [...list.querySelectorAll('.it')].forEach(x=>x.classList.remove('on'));
                          d.classList.add('on'); load(it.f, it.label);
                          if (window.innerWidth <= 820) body.classList.remove('nav'); };
    }
    list.appendChild(d);
    if (!first && !it.href) first = {d, it};
  }
}
if (first){ first.d.classList.add('on'); load(first.it.f, first.it.label); }

document.getElementById('burger').onclick = () => body.classList.toggle('nav');
document.getElementById('mask').onclick = () => body.classList.remove('nav');

// 交互：鼠标 + 触摸
let drag = false, px = 0, py = 0, btn = 0;
canvas.addEventListener('mousedown', e => { drag = true; px = e.clientX; py = e.clientY; btn = e.button; });
window.addEventListener('mouseup', () => drag = false);
window.addEventListener('mousemove', e => {
  if (!drag) return;
  const dx = e.clientX - px, dy = e.clientY - py; px = e.clientX; py = e.clientY;
  if (btn === 2){ target.x -= dx * dist * 0.0015; target.y += dy * dist * 0.0015; }
  else { theta -= dx * 0.008; phi = Math.max(0.15, Math.min(3.0, phi - dy * 0.008)); }
  render();
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { e.preventDefault(); dist *= (1 + Math.sign(e.deltaY)*0.1); render(); }, {passive:false});

// 触摸：单指旋转 / 双指缩放
let tPrev = null, pinch = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1){ tPrev = {x:e.touches[0].clientX, y:e.touches[0].clientY}; pinch = 0; }
  else if (e.touches.length === 2){
    pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                       e.touches[0].clientY - e.touches[1].clientY);
    tPrev = null;
  }
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && tPrev){
    const dx = e.touches[0].clientX - tPrev.x, dy = e.touches[0].clientY - tPrev.y;
    tPrev = {x:e.touches[0].clientX, y:e.touches[0].clientY};
    theta -= dx * 0.010; phi = Math.max(0.15, Math.min(3.0, phi - dy * 0.010));
    render();
  } else if (e.touches.length === 2 && pinch){
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY);
    if (d > 0){ dist *= pinch / d; pinch = d; render(); }
  }
}, {passive:false});
canvas.addEventListener('touchend', () => { tPrev = null; pinch = 0; });

let rt = null;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 120); });
window.addEventListener('orientationchange', () => setTimeout(render, 260));
render();
window.addEventListener('load', render);
