<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Spine 预览</title>
<style>
  html,body{margin:0;height:100%;background:#0c0b0a;color:#e8e0d8;font:13px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}
  #wrap{display:flex;height:100%}
  #stage{flex:1;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100%;max-height:100%}
  #side{width:260px;border-left:1px solid #2b231d;padding:14px;box-sizing:border-box;overflow:auto}
  h1{font-size:15px;margin:0 0 8px}
  .kv{display:flex;justify-content:space-between;font-size:12px;color:#a8988a;margin:3px 0}
  select,button{width:100%;margin-top:8px;background:#171310;color:#e8e0d8;border:1px solid #3a2f26;border-radius:6px;padding:6px}
  #err{color:#ff8a7a;font-size:12px;white-space:pre-wrap;margin-top:10px}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="cv" width="512" height="512"></canvas></div>
  <div id="side">
    <h1>Spine 预览</h1>
    <div class="kv"><span>版本</span><b id="ver">-</b></div>
    <div class="kv"><span>尺寸</span><b id="size">-</b></div>
    <div class="kv"><span>动画</span><b id="anim">-</b></div>
    <div class="kv"><span>帧率</span><b id="fps">-</b></div>
    <select id="animSel"></select>
    <button id="pause">暂停 / 继续</button>
    <div id="err"></div>
  </div>
</div>
<script src="assets/spine_runtime/spine-webgl-3.8.js"></script>
<script>
const q = new URLSearchParams(location.search);
const dir = q.get('d') || 'ui/spine/touxiang_ani';
const name = q.get('n') || 'icon_touxiang_67';
const base = `assets/spine_live/${dir}/${name}`;
const err = m => { document.getElementById('err').textContent += m + "\n"; console.error(m); };

const canvas = document.getElementById('cv');
const gl = canvas.getContext('webgl', {alpha: true, premultipliedAlpha: false, preserveDrawingBuffer: true});
if (!gl) err('WebGL 不可用');

let renderer, skeleton, state, paused = false, last = 0, acc = 0, frames = 0;

function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0);
  last = now;
  if (!paused) {
    try {
      if (window.__staticPose) { skeleton.setToSetupPose(); }
      else { state.update(dt); state.apply(skeleton); }
      skeleton.updateWorldTransform();
      // 动画会把槽位 alpha 拉回 0（游戏由运行时控制），预览每帧强制不透明
      if (window.__forceAlpha) skeleton.slots.forEach(sl => { sl.color.a = 1; });
    }
    catch (e) { err('anim: ' + e.message); paused = true; }
  }
  try {
    renderer.begin();
    renderer.drawSkeleton(skeleton, true);
    renderer.end();
  } catch (e) { err('draw: ' + e.message); paused = true; }
  frames++; acc += dt;
  if (acc >= 0.5) { document.getElementById('fps').textContent = Math.round(frames / acc); frames = 0; acc = 0; }
  requestAnimationFrame(tick);
}

function loadImage(url) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('图片加载失败 ' + url));
    img.src = url;
  });
}

async function boot() {
  try {
    const [atlasText, jsonText] = await Promise.all([
      fetch(`${base}.atlas`).then(r => r.text()),
      fetch(`${base}.json`).then(r => r.text()),
    ]);
    const atlasDir = base.slice(0, base.lastIndexOf('/') + 1);

    // 先从 atlas 文本里取出贴图页文件名，预加载成 Image
    const pages = atlasText.split(/\r?\n/).filter(l => /\.(png|jpg|webp)$/i.test(l.trim()))
      .map(l => l.trim());
    const imgs = {};
    await Promise.all(pages.map(async p => {
      let url = atlasDir + p;
      try { await loadImage(url); } catch (e) {
        // 该包过期时兜底：同目录 page0.png（早期转换产物）
        url = atlasDir + "page0.png";
      }
      imgs[p] = await loadImage(url);
    }));

    const atlas = new spine.TextureAtlas(atlasText, path => {
      const img = imgs[path];
      if (!img) throw new Error('atlas 引用了未预加载的页: ' + path);
      return new spine.webgl.GLTexture(gl, img);
    });
    // 3.8 导出把 skins 写成对象，而运行时按数组读：这里统一转成数组
    const rawJson = JSON.parse(jsonText);
    if (rawJson.skins && !Array.isArray(rawJson.skins)) {
      rawJson.skins = Object.keys(rawJson.skins).map(k => ({ name: k, attachments: rawJson.skins[k] }));
    }
    const json = new spine.SkeletonJson(new spine.AtlasAttachmentLoader(atlas));
    const data = json.readSkeletonData(rawJson);

    skeleton = new spine.Skeleton(data);
    const skinNames = (data.skins || []).map(s => s.name);
    try { skeleton.setSkinByName(skinNames.includes("default") ? "default" : skinNames[0]); } catch (e) { err("skin: " + e.message); }
    skeleton.setToSetupPose();
    // 游戏里槽位 alpha 初始为 0，由运行时淡入；静态预览统一置为不透明
    skeleton.slots.forEach(sl => { try { sl.color.a = 1; } catch (e) {} });
    skeleton.updateWorldTransform();
    state = new spine.AnimationState(new spine.AnimationStateData(data));

    const names = (data.animations || []).map(a => a.name);
    document.getElementById('ver').textContent = data.version || '?';
    document.getElementById('size').textContent = Math.round(data.width) + ' × ' + Math.round(data.height);
    document.getElementById('anim').textContent = names[0] || '-';
    const sel = document.getElementById('animSel');
    sel.innerHTML = names.map(n => `<option>${n}</option>`).join('');
    sel.onchange = () => state.setAnimation(0, sel.value, true);
    if (names[0]) state.setAnimation(0, names[0], true);

    renderer = new spine.webgl.SceneRenderer(canvas, gl, true);
    const w = data.width || 200, h = data.height || 200;
    const cw = canvas.width, ch = canvas.height;
    const fit = Math.max(w / cw, h / ch) * 1.2;
    const Q = new URLSearchParams(location.search);
    const vw = Number(Q.get('vw') || 0), px = Q.get('px'), py = Q.get('py');
    renderer.camera.viewportWidth = vw || cw * fit;
    renderer.camera.viewportHeight = vw || ch * fit;
    renderer.camera.position = new spine.webgl.Vector3(
      px !== null ? Number(px) : w / 2,
      py !== null ? Number(py) : h / 2, 0);
    renderer.camera.update();

    window.__dbg = {atlas, skeleton, state, renderer, data, pages};
    requestAnimationFrame(tick);
  } catch (e) {
    err('启动失败: ' + (e && e.message ? e.message : e));
    console.error(e);
  }
}
document.getElementById('pause').onclick = () => { paused = !paused; };
boot();
</script>
</body>
</html>
