<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明日之后 - 3D模型预览器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }
        #container { width: 100vw; height: 100vh; display: flex; }
        #sidebar {
            width: 300px; background: #16213e; padding: 20px;
            overflow-y: auto; border-right: 1px solid #0f3460;
        }
        #viewer { flex: 1; position: relative; }
        #canvas-container { width: 100%; height: 100%; }
        h1 { font-size: 18px; margin-bottom: 20px; color: #e94560; }
        h2 {
            font-size: 14px; margin: 15px 0 10px; color: #fff;
            background: #e94560; padding: 5px 10px; border-radius: 4px;
        }
        .file-input { margin-bottom: 15px; }
        .file-input label { display: block; font-size: 12px; margin-bottom: 5px; color: #aaa; }
        .file-input input[type="file"] {
            width: 100%; padding: 8px; background: #0f3460;
            border: 1px solid #16213e; border-radius: 4px; color: #eee; font-size: 12px;
        }
        .info-panel {
            background: #0f3460; padding: 10px; border-radius: 4px;
            margin-bottom: 10px; font-size: 12px;
        }
        .info-panel .row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .info-panel .label { color: #aaa; }
        .info-panel .value { color: #e94560; font-weight: bold; }
        .controls { margin-top: 15px; }
        .controls button {
            width: 100%; padding: 8px; margin-bottom: 5px;
            background: #e94560; border: none; border-radius: 4px;
            color: white; cursor: pointer; font-size: 12px;
        }
        .controls button:hover { background: #ff6b6b; }
        .controls button.secondary { background: #0f3460; }
        .controls button.secondary:hover { background: #16213e; }
        #status {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.7); padding: 10px 15px;
            border-radius: 4px; font-size: 12px; color: #4ade80;
        }
        #stats {
            position: absolute; bottom: 10px; left: 10px;
            background: rgba(0,0,0,0.7); padding: 10px 15px;
            border-radius: 4px; font-size: 11px; color: #aaa;
        }
        .format-list { font-size: 11px; color: #888; line-height: 1.6; }
        .format-list li { margin-left: 15px; }
    </style>
</head>
<body>
    <div id="container">
        <div id="sidebar">
            <h1>3D模型预览器</h1>
            <h2>加载模型</h2>
            <div class="file-input">
                <label>模型文件 (.obj / .gltf / .glb / .fbx)</label>
                <input type="file" id="model-file" accept=".obj,.gltf,.glb,.fbx">
            </div>
            <div class="file-input">
                <label>贴图文件 (.png / .jpg)</label>
                <input type="file" id="texture-file" accept=".png,.jpg" multiple>
            </div>
            <h2>模型信息</h2>
            <div class="info-panel" id="model-info">
                <div class="row"><span class="label">状态:</span><span class="value">等待加载</span></div>
                <div class="row"><span class="label">顶点数:</span><span class="value">-</span></div>
                <div class="row"><span class="label">面数:</span><span class="value">-</span></div>
                <div class="row"><span class="label">材质数:</span><span class="value">-</span></div>
            </div>
            <h2>显示控制</h2>
            <div class="controls">
                <button onclick="toggleWireframe()">切换线框模式</button>
                <button onclick="toggleAutoRotate()" class="secondary">自动旋转: 开</button>
                <button onclick="resetCamera()" class="secondary">重置视角</button>
                <button onclick="clearScene()" class="secondary">清空场景</button>
            </div>
            <h2>支持格式</h2>
            <ul class="format-list">
                <li>OBJ (通用格式)</li>
                <li>glTF / GLB</li>
                <li>FBX</li>
                <li>RGIS (NeoX模型，开发中)</li>
                <li>DDS贴图 (需转换)</li>
            </ul>
        </div>
        <div id="viewer">
            <div id="canvas-container"></div>
            <div id="status">就绪 - 请选择模型文件</div>
            <div id="stats">FPS: 60 | 三角形: 0</div>
        </div>
    </div>
    <script>
/* 2026-09-21 双模资源：http(s)/本地服务 → 内置 vendor（离线可用）；直接双击 file:// → CDN
   （file:// 下相对模块导入会被浏览器 CORS 拦截，故走 CDN 兼容双击用法）。 */
(function () {
  var fileMode = location.protocol === 'file:';
  var imports = fileMode
    ? { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" }
    : { "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/" };
  var s = document.createElement('script');
  s.type = 'importmap';
  s.textContent = JSON.stringify({ imports: imports });
  document.currentScript.parentNode.insertBefore(s, document.currentScript.nextSibling);
})();
</script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(3, 2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);
        const pointLight = new THREE.PointLight(0xe94560, 0.5, 100);
        pointLight.position.set(-5, 3, -5);
        scene.add(pointLight);

        const gridHelper = new THREE.GridHelper(10, 20, 0x0f3460, 0x16213e);
        scene.add(gridHelper);
        const axesHelper = new THREE.AxesHelper(2);
        scene.add(axesHelper);

        let currentModel = null;
        let wireframeMode = false;

        document.getElementById('model-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const status = document.getElementById('status');
            status.textContent = '加载中: ' + file.name;
            status.style.color = '#fbbf24';
            const url = URL.createObjectURL(file);
            const ext = file.name.split('.').pop().toLowerCase();
            clearScene();
            const loader = getLoader(ext);
            if (!loader) {
                status.textContent = '不支持的格式: ' + ext;
                status.style.color = '#ef4444';
                return;
            }
            loader.load(url, function(object) {
                currentModel = object;
                scene.add(object);
                const box = new THREE.Box3().setFromObject(object);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 2 / maxDim;
                object.scale.setScalar(scale);
                object.position.sub(center.multiplyScalar(scale));
                updateModelInfo(object);
                status.textContent = '加载成功: ' + file.name;
                status.style.color = '#4ade80';
                URL.revokeObjectURL(url);
            }, undefined, function(error) {
                status.textContent = '加载失败: ' + error.message;
                status.style.color = '#ef4444';
            });
        });

        function getLoader(ext) {
            switch(ext) {
                case 'obj': return new OBJLoader();
                case 'gltf': case 'glb': return new GLTFLoader();
                case 'fbx': return new FBXLoader();
                default: return null;
            }
        }

        function updateModelInfo(object) {
            let vertices = 0, triangles = 0, materials = 0;
            object.traverse(function(child) {
                if (child.isMesh) {
                    if (child.geometry) {
                        if (child.geometry.attributes.position) vertices += child.geometry.attributes.position.count;
                        if (child.geometry.index) triangles += child.geometry.index.count / 3;
                        else if (child.geometry.attributes.position) triangles += child.geometry.attributes.position.count / 3;
                    }
                    if (child.material) materials += Array.isArray(child.material) ? child.material.length : 1;
                }
            });
            const rows = document.querySelectorAll('#model-info .row');
            rows[0].querySelector('.value').textContent = '已加载';
            rows[1].querySelector('.value').textContent = vertices.toLocaleString();
            rows[2].querySelector('.value').textContent = Math.floor(triangles).toLocaleString();
            rows[3].querySelector('.value').textContent = materials;
        }

        window.toggleWireframe = function() {
            wireframeMode = !wireframeMode;
            if (currentModel) {
                currentModel.traverse(function(child) {
                    if (child.isMesh && child.material) {
                        if (Array.isArray(child.material)) child.material.forEach(m => m.wireframe = wireframeMode);
                        else child.material.wireframe = wireframeMode;
                    }
                });
            }
        };
        window.toggleAutoRotate = function() {
            controls.autoRotate = !controls.autoRotate;
            event.target.textContent = '自动旋转: ' + (controls.autoRotate ? '开' : '关');
        };
        window.resetCamera = function() {
            camera.position.set(3, 2, 5);
            controls.target.set(0, 0, 0);
            controls.update();
        };
        window.clearScene = function() {
            if (currentModel) { scene.remove(currentModel); currentModel = null; }
            const rows = document.querySelectorAll('#model-info .row');
            rows[0].querySelector('.value').textContent = '等待加载';
            rows[1].querySelector('.value').textContent = '-';
            rows[2].querySelector('.value').textContent = '-';
            rows[3].querySelector('.value').textContent = '-';
            document.getElementById('status').textContent = '就绪 - 请选择模型文件';
            document.getElementById('status').style.color = '#4ade80';
        };

        window.addEventListener('resize', function() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        let frameCount = 0, lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                const fps = Math.round(frameCount * 1000 / (currentTime - lastTime));
                let triangles = 0;
                if (currentModel) {
                    currentModel.traverse(function(child) {
                        if (child.isMesh && child.geometry && child.geometry.index) triangles += child.geometry.index.count / 3;
                    });
                }
                document.getElementById('stats').textContent = 'FPS: ' + fps + ' | 三角形: ' + Math.floor(triangles).toLocaleString();
                frameCount = 0; lastTime = currentTime;
            }
        }
        animate();
    </script>
</body>
</html>
