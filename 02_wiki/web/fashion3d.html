<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>人物时装 3D 原型 · 明日之后 Lifeafter Wiki</title>
<style>
  :root{--bg:#0e1014;--panel:#14171c;--line:#23272e;--fg:#e8eaf0;--dim:#aab2c0;--acc:#ffb02e;--blue:#8fd3ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
            font-family:system-ui,"Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
  #top{position:fixed;left:0;right:0;top:0;height:48px;z-index:30;display:flex;align-items:center;gap:10px;
       padding:0 12px;background:rgba(20,23,28,.94);border-bottom:1px solid var(--line);
       backdrop-filter:blur(6px);padding-top:env(safe-area-inset-top)}
  #top a.back{color:var(--blue);text-decoration:none;font-size:13px;white-space:nowrap;
              border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:#1b1f26}
  #top a.back:active{background:#232a34}
  #top h1{margin:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #burger{margin-left:auto;display:none;border:1px solid var(--line);background:#1b1f26;color:var(--fg);
          border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
  #wrap{position:absolute;left:0;right:0;top:48px;bottom:0;display:flex}
  #list{width:258px;flex:0 0 258px;overflow-y:auto;background:var(--panel);
        border-right:1px solid var(--line);padding:6px 8px calc(14px + env(safe-area-inset-bottom))}
  #list h3{margin:12px 4px 5px;font-size:12px;color:#5f6b7d;font-weight:600;letter-spacing:.4px}
  #list .it{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--dim);line-height:1.35}
  #list .it:hover{background:#1d2129;color:var(--fg)}
  #list .it.on{background:#2a3140;color:var(--acc);font-weight:700}
  #list .sub{font-size:11px;color:#5f6b7d;margin:2px 0 0 10px}
  #main{flex:1;position:relative;min-width:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:absolute;left:12px;top:10px;font-size:13px;color:var(--blue);font-weight:700;
       text-shadow:0 0 6px #000;pointer-events:none;max-width:calc(100% - 24px)}
  #tools{position:absolute;right:12px;top:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  #tools button{border:1px solid var(--line);background:#1b1f26;color:var(--dim);border-radius:7px;
                padding:5px 9px;font-size:12px;cursor:pointer}
  #tools button.on{color:var(--acc);border-color:#4b3a16;background:#2a2416}
  #parts{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;
         gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px)}
  #parts label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);
               background:rgba(20,23,28,.9);border:1px solid var(--line);border-radius:7px;padding:4px 8px;cursor:pointer}
  #parts input{accent-color:#ffb02e}
  #tip{position:absolute;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));font-size:12px;color:#6b7280;pointer-events:none}
  #clue{position:absolute;right:14px;bottom:calc(52px + env(safe-area-inset-bottom));width:min(330px,calc(100% - 28px));max-height:46%;overflow:auto;z-index:12;padding:14px 16px;background:rgba(20,23,28,.95);border:1px solid #354052;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.38);backdrop-filter:blur(8px)}
  #clue .clue-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  #clue .clue-title{font-size:15px;font-weight:750;line-height:1.35}
  #clue .clue-close{margin-left:auto;border:1px solid var(--line);border-radius:7px;background:#1b1f26;color:var(--dim);font-size:18px;line-height:1;padding:3px 8px;cursor:pointer}
  #clue dl{display:grid;grid-template-columns:72px 1fr;gap:7px 10px;margin:0;font-size:12px;line-height:1.45}
  #clue dt{color:#7f8da3}
  #clue dd{margin:0;overflow-wrap:anywhere}
  #clue .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#d6deeb}
  #clue .clue-note{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line);color:var(--dim);font-size:11px;line-height:1.55}
  @media (max-width:820px){
    #burger{display:block}
    #wrap{display:block}
    #list{position:fixed;left:0;top:48px;bottom:0;width:82vw;max-width:330px;z-index:25;
          transform:translateX(-102%);transition:transform .22s ease;box-shadow:6px 0 24px rgba(0,0,0,.5);padding-top:8px}
    body.nav #list{transform:translateX(0)}
    #main{position:absolute;left:0;right:0;top:0;bottom:0}
    #clue{top:52px}
  }
</style></head><body>
<div id="top">
  <a class="back" href="index.html">← 主页</a><a class="back" href="wiki.html">← Wiki</a>
  <h1>人物时装 3D 原型</h1>
  <button id="burger" aria-label="展开列表">目录</button>
</div>
<div id="wrap">
  <div id="list"><h3>5 套主力款</h3></div>
  <div id="main"><canvas id="c"></canvas><div id="hud">加载中…</div>
    <div id="tools"><button id="btn-white">白模</button><button id="btn-spin">自动旋转</button><button id="btn-reset">复位</button></div>
    <div id="parts"></div>
    <div id="tip">拖拽旋转 · 滚轮缩放 · 右键平移</div>
    <aside id="clue" hidden><div class="clue-head"><div id="clue-title" class="clue-title"></div><button id="clue-close" class="clue-close" aria-label="关闭">×</button></div><div id="clue-body"></div></aside>
  </div>
</div>
<script>
(function(){
  if (location.protocol !== 'file:') return;
  window.addEventListener('DOMContentLoaded', function(){
    var hud = document.getElementById('hud');
    if (hud) hud.textContent = '未通过本地服务打开';
    var box = document.createElement('div');
    box.style.cssText = 'position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);max-width:540px;padding:18px 20px;background:rgba(20,23,28,.96);border:1px solid #354052;border-radius:12px;color:#e8eaf0;font-size:13px;line-height:1.75;z-index:40;text-align:center';
    box.innerHTML = '<strong style="color:#ffb02e;font-size:15px">需要本地服务才能加载 3D</strong><br>当前是 file:// 直接打开，浏览器会拦截模型和 JSON。<br>请双击同目录的 <code style="color:#8fd3ff">启动3D查看器.bat</code>，<br>或手动运行：<br><code style="color:#8fd3ff">python -m http.server 8770 --bind 127.0.0.1</code><br>然后访问 <code style="color:#8fd3ff">http://127.0.0.1:8770/fashion3d.html</code>';
    var host = document.getElementById('main') || document.body;
    host.appendChild(box);
  });
})();
</script>
<script type="module">
import * as THREE from './assets/vendor/three/three.module.min.js';
import { GLTFLoader } from './assets/vendor/three/addons/loaders/GLTFLoader.js';

const INDEX_URL = './assets/3d/fashion_3d/index.json?v=20261102c';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setClearColor(0x0e1014, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xcfd9ff, 0x1a1c22, 0.55));
const k1 = new THREE.DirectionalLight(0xfff2e0, 1.45); k1.position.set(4,7,6); scene.add(k1);
const k2 = new THREE.DirectionalLight(0x8fb0ff, 0.55); k2.position.set(-6,3,-5); scene.add(k2);
const k3 = new THREE.DirectionalLight(0xffc070, 0.3); k3.position.set(-2,-2,5); scene.add(k3);
const grid = new THREE.GridHelper(6, 24, 0x2a3140, 0x1b1f26); scene.add(grid);

// 程序化 studio 环境（PMREM）：没有 IBL 时 PBR 的金属/粗糙度会被压黑，贴图颜色出不来
function makeStudioEnv(){
  const c = document.createElement('canvas'); c.width = 768; c.height = 384;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 384);
  g.addColorStop(0, '#b8c9e6'); g.addColorStop(0.42, '#6a7488');
  g.addColorStop(0.58, '#39404e'); g.addColorStop(1, '#16181d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 768, 384);
  const soft = (x, y, r, col) => {
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  };
  soft(200, 120, 150, 'rgba(255,244,228,0.95)');
  soft(600, 140, 170, 'rgba(150,190,255,0.55)');
  soft(420, 330, 220, 'rgba(255,170,110,0.22)');
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pm = new THREE.PMREMGenerator(renderer);
  const rt = pm.fromEquirectangular(tex);
  tex.dispose(); pm.dispose();
  return rt.texture;
}
scene.environment = makeStudioEnv();
if ('environmentIntensity' in scene) scene.environmentIntensity = 1.0;

const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 2000);
let target = new THREE.Vector3(0,0,0), dist = 6, theta = 0.32, phi = 1.30;
let group = null, loading = 0, spin = false, white = false;
const partObjs = new Map();
const loader = new GLTFLoader();

function render(){
  renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
  const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
  cam.aspect = w / h;
  cam.position.set(target.x + dist*Math.sin(phi)*Math.sin(theta),
                   target.y + dist*Math.cos(phi),
                   target.z + dist*Math.sin(phi)*Math.cos(theta));
  cam.lookAt(target); cam.updateProjectionMatrix();
  renderer.render(scene, cam);
}
function clearOutfit(){
  if (group){ scene.remove(group); group.traverse(n=>{ if(n.isMesh){ n.geometry.dispose();
    const ms = Array.isArray(n.material)?n.material:[n.material]; for(const m of ms){ if (m.map) m.map.dispose(); m.dispose(); } } }); group = null; }
  partObjs.clear();
  document.getElementById('parts').innerHTML = '';
}
function frame(){
  const box = new THREE.Box3().setFromObject(group);
  const c = box.getCenter(new THREE.Vector3());
  group.position.sub(c);                 // 合体后整体居中（各部件不再单独居中）
  group.updateMatrixWorld(true);
  const s = box.getSize(new THREE.Vector3());
  const r = Math.max(s.x, s.y, s.z) * 0.58;
  grid.position.y = box.min.y - c.y - 0.02;
  grid.scale.setScalar(Math.max(1, r / 2.2));
  target.set(0,0,0);
  const portrait = canvas.clientWidth < canvas.clientHeight;
  dist = r / Math.tan((cam.fov*Math.PI/180)/2) * (portrait ? 1.30 : 1.08);
  render();
  window.__fitted = true;
}
function setWhite(on){
  white = on;
  document.getElementById('btn-white').classList.toggle('on', on);
  if (!group) return;
  group.traverse(n => {
    if (!n.isMesh || !n.material) return;
    if (on){
      if (!n.userData.origMat) n.userData.origMat = n.material;
      n.material = new THREE.MeshStandardMaterial({color:0xc8ccd4, roughness:0.72, metalness:0.06, side:THREE.DoubleSide});
    } else if (n.userData.origMat){ n.material = n.userData.origMat; }
  });
  render();
}
function tuneMaterial(mm){
  mm.side = THREE.DoubleSide;
  mm.envMapIntensity = 1.15;
  const ex = mm.userData || {};
  if (ex.blend_mode === 'additive'){        // uber_fx 发光层：加法混合，不写深度
    mm.blending = THREE.AdditiveBlending;
    mm.depthWrite = false;
    mm.transparent = true;
  } else if (mm.transparent){               // 半透白纱：关闭深度写入，避免自身遮挡出硬边
    mm.depthWrite = false;
    mm.alphaTest = 0.01;
  }
  mm.needsUpdate = true;
}
function loadOutfit(item){
  clearOutfit();
  document.getElementById('hud').textContent = item.label + ' · 加载中…';
  showClue(item);
  group = new THREE.Group(); scene.add(group);
  const rotX = ((item.viewer && Number.isFinite(item.viewer.rotate_x_deg)) ? item.viewer.rotate_x_deg : 0) * Math.PI / 180;
  loading = item.parts.length; window.__loaded = 0; window.__fitted = false;
  for (const p of item.parts){
    const holder = new THREE.Group(); holder.rotation.x = rotX; holder.name = p.id;
    group.add(holder); partObjs.set(p.id, holder);
    const chip = document.createElement('label');
    chip.innerHTML = '<input type="checkbox" checked> ' + p.label;
    chip.querySelector('input').onchange = (e) => { holder.visible = e.target.checked; render(); };
    document.getElementById('parts').appendChild(chip);
    loader.load('./assets/3d/fashion_3d/' + item.outfit_id + '/' + p.file, (g) => {
      const o = g.scene;
      o.traverse(n => { if (n.isMesh && n.material){
        const ms = Array.isArray(n.material)?n.material:[n.material];
        let hideMesh = false;
        for (const mm of ms){ tuneMaterial(mm); if (mm.userData && mm.userData.hide) hideMesh = true; }
        if (hideMesh) n.visible = false;   // rim_diss 特效壳：不参与渲染，避免白色/碎片外壳
      }});
      holder.add(o);
      window.__loaded++;
      if (--loading === 0){ document.getElementById('hud').textContent = item.label; frame(); if (white) setWhite(true); }
    }, undefined, (e) => { window.__err = String(e); document.getElementById('hud').textContent = '加载失败: ' + p.file; });
  }
}
function showClue(item){
  const el = document.getElementById('clue');
  const rows = [
    ['系列号', item.series + ' · ' + item.gender + ' · ' + item.label.split('·').pop().trim()],
    ['材质等级', item.material + '（近似直出，非引擎逐位复现）'],
    ['部件', item.parts.map(p=>p.label+'('+p.submeshes+')').join(' + ')],
    ['来源', item.parts[0].source_mesh],
  ];
  const miss = item.parts.flatMap(p=>p.missing.map(m=>m.path));
  if (miss.length) rows.push(['缺失贴图', miss.join('、')]);
  document.getElementById('clue-title').textContent = item.label;
  document.getElementById('clue-body').innerHTML = '<dl>' + rows.map(([k,v])=>'<dt>'+k+'</dt><dd class="mono">'+String(v).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</dd>').join('') + '</dl>'
    + '<p class="clue-note">' + item.note + ' ' + item.material_note + '</p>';
  el.hidden = false;
}
document.getElementById('clue-close').onclick = () => document.getElementById('clue').hidden = true;

// 交互
let drag = false, px = 0, py = 0, btn = 0;
canvas.addEventListener('mousedown', e => { drag = true; px = e.clientX; py = e.clientY; btn = e.button; });
window.addEventListener('mouseup', () => drag = false);
window.addEventListener('mousemove', e => {
  if (!drag) return;
  const dx = e.clientX - px, dy = e.clientY - py; px = e.clientX; py = e.clientY;
  if (btn === 2){ target.x -= dx * dist * 0.0015; target.y += dy * dist * 0.0015; }
  else { theta -= dx * 0.008; phi = Math.max(0.15, Math.min(3.0, phi - dy * 0.008)); }
  render();
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { e.preventDefault(); dist *= (1 + Math.sign(e.deltaY)*0.1); render(); }, {passive:false});
let tPrev = null, pinch = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1){ tPrev = {x:e.touches[0].clientX, y:e.touches[0].clientY}; pinch = 0; }
  else if (e.touches.length === 2){ pinch = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); tPrev = null; }
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && tPrev){
    const dx = e.touches[0].clientX - tPrev.x, dy = e.touches[0].clientY - tPrev.y;
    tPrev = {x:e.touches[0].clientX, y:e.touches[0].clientY};
    theta -= dx * 0.010; phi = Math.max(0.15, Math.min(3.0, phi - dy * 0.010));
  } else if (e.touches.length === 2 && pinch){
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if (d > 0){ dist *= pinch / d; pinch = d; }
  }
  render();
}, {passive:false});
canvas.addEventListener('touchend', () => { tPrev = null; pinch = 0; });
document.getElementById('burger').onclick = () => document.body.classList.toggle('nav');
document.getElementById('btn-white').onclick = () => setWhite(!white);
document.getElementById('btn-reset').onclick = () => { if (group && group.parent){ theta = 0.32; phi = 1.30; frame(); } };
document.getElementById('btn-spin').onclick = (e) => { spin = !spin; e.target.classList.toggle('on', spin); };
window.addEventListener('resize', () => { clearTimeout(window.__rt); window.__rt = setTimeout(render, 120); });

let cur = null;
fetch(INDEX_URL).then(r => r.json()).then(data => {
  const list = document.getElementById('list');
  const want = new URLSearchParams(location.search).get('id') || '';
  const startIdx = Math.max(0, data.outfits.findIndex(o => o.outfit_id === want));
  data.outfits.forEach((it, i) => {
    const d = document.createElement('div'); d.className = 'it';
    d.innerHTML = it.label + '<div class="sub">' + it.parts.length + ' 部件 · ' + it.parts.reduce((a,p)=>a+p.submeshes,0) + ' 子网格</div>';
    d.onclick = () => { list.querySelectorAll('.it').forEach(x=>x.classList.remove('on'));
      d.classList.add('on'); cur = it; loadOutfit(it); if (innerWidth <= 820) document.body.classList.remove('nav'); };
    list.appendChild(d);
    if (i === startIdx){ d.classList.add('on'); cur = it; loadOutfit(it); }
  });
}).catch(e => { document.getElementById('hud').textContent = '索引加载失败: ' + e; });

(function anim(){
  requestAnimationFrame(anim);
  if (spin && group){ theta += 0.004; render(); }
})();
render();
window.addEventListener('load', render);
</script></body></html>
