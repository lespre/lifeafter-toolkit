<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>斩神系列渲染 专题 · 明日之后 Lifeafter Wiki</title>
<style>
  :root{--bg:#0e1014;--panel:#14171c;--line:#23272e;--fg:#e8eaf0;--dim:#aab2c0;--acc:#ffb02e;--blue:#8fd3ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
            font-family:system-ui,"Microsoft YaHei",sans-serif;
            -webkit-text-size-adjust:100%}
  /* 顶部栏 */
  #top{position:fixed;left:0;right:0;top:0;height:48px;z-index:30;display:flex;align-items:center;gap:10px;
       padding:0 12px;background:rgba(20,23,28,.94);border-bottom:1px solid var(--line);
       backdrop-filter:blur(6px);padding-top:env(safe-area-inset-top)}
  #top a.back{color:var(--blue);text-decoration:none;font-size:13px;white-space:nowrap;
              border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:#1b1f26}
  #top a.back:active{background:#232a34}
  #top h1{margin:0;font-size:14px;font-weight:700;color:var(--fg);white-space:nowrap;
          overflow:hidden;text-overflow:ellipsis}
  #burger{margin-left:auto;display:none;border:1px solid var(--line);background:#1b1f26;color:var(--fg);
          border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
  /* 布局 */
  #wrap{position:absolute;left:0;right:0;top:48px;bottom:0;display:flex}
  #list{width:250px;flex:0 0 250px;overflow-y:auto;background:var(--panel);
        border-right:1px solid var(--line);padding:6px 8px calc(14px + env(safe-area-inset-bottom))}
  #list h3{margin:12px 4px 5px;font-size:12px;color:#5f6b7d;font-weight:600;letter-spacing:.4px}
  #list .it{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--dim);line-height:1.35}
  #list .it:hover{background:#1d2129;color:var(--fg)}
  #list .it.on{background:#2a3140;color:var(--acc);font-weight:700}
  #list .it.ext{color:var(--blue);border:1px dashed var(--line);margin-top:4px}
  #list .it.ext::after{content:" ↗"}
  #main{flex:1;position:relative;min-width:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:absolute;left:12px;top:10px;font-size:13px;color:var(--blue);font-weight:700;
       text-shadow:0 0 6px #000;pointer-events:none;max-width:calc(100% - 24px)}
  #tip{position:absolute;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));
       font-size:12px;color:#6b7280;pointer-events:none}
  #mask{display:none}
  /* 手机 / 窄屏 */
  @media (max-width:820px){
    #burger{display:block}
    #wrap{display:block}
    #list{position:fixed;left:0;top:48px;bottom:0;width:82vw;max-width:330px;z-index:25;
          transform:translateX(-102%);transition:transform .22s ease;box-shadow:6px 0 24px rgba(0,0,0,.5);
          padding-top:8px}
    body.nav #list{transform:translateX(0)}
    body.nav #mask{display:block;position:fixed;left:0;right:0;top:48px;bottom:0;z-index:20;
                   background:rgba(0,0,0,.45)}
    #main{position:absolute;left:0;right:0;top:0;bottom:0}
    #hud{font-size:12px;left:10px;top:8px}
    #tip{font-size:11px}
  }
  @media (max-width:820px) and (orientation:landscape){
    #list{width:64vw;max-width:300px}
  }
</style></head><body>
<div id="top">
  <a class="back" href="index.html">← 返回主页</a><a class="back" href="wiki.html">← 返回 Wiki</a>
  <h1>斩神系列渲染 专题</h1>
  <button id="burger" aria-label="展开列表">目录</button>
</div>
<div id="wrap">
  <div id="mask"></div>
  <div id="list"></div>
  <div id="main"><canvas id="c"></canvas><div id="hud"></div>
  <div id="tip">拖拽旋转 · 双指/滚轮缩放 · 右键平移</div></div>
</div>
<script type="module">
import * as THREE from './assets/vendor/three/three.module.min.js';
import { GLTFLoader } from './assets/vendor/three/addons/loaders/GLTFLoader.js';

const GROUPS = [{"g": "炽翼使徒·头饰（斩神联动）", "items": [{"f": "character_b_m_3722_h_m_3722_1_high.glb", "label": "炽翼使徒·男 · h_m_3722_1_high.mesh · v19854/f19525"}, {"f": "character_b_f_3722_h_f_3722_1_high.glb", "label": "炽翼使徒·女 · h_f_3722_1_high.mesh · v27459/f20672"}]}, {"g": "墨自无心·头饰", "items": [{"f": "character_b_f_3696_h_f_3696_1_high.glb", "label": "墨自无心·女 · h_f_3696_1_high.mesh · v12880/f10605"}]}, {"g": "幻夜神谕（联动典藏版）", "items": [{"f": "f_cloth_full.glb", "label": "幻夜神谕·女 衣服（完整版·含人形）"}, {"f": "head_f.glb", "label": "幻夜神谕·女 头饰"}, {"f": "m_cloth_full.glb", "label": "幻夜神谕·男 衣服（完整版·含人形）"}, {"f": "head_m.glb", "label": "幻夜神谕·男 头饰"}]}, {"g": "红尘剑仙", "items": [{"f": "hc_m_cloth.glb", "label": "红尘剑仙·男 衣服"}, {"f": "hc_m_head.glb", "label": "红尘剑仙·男 头饰"}, {"f": "hc_f_cloth.glb", "label": "红尘剑仙·女 衣服"}, {"f": "hc_f_head.glb", "label": "红尘剑仙·女 头饰"}]}, {"g": "时隙之花", "items": [{"f": "sx_m_cloth.glb", "label": "时隙之花·男 衣服"}, {"f": "sx_m_head.glb", "label": "时隙之花·男 头饰"}, {"f": "sx_f_cloth.glb", "label": "时隙之花·女 衣服"}, {"f": "sx_f_head.glb", "label": "时隙之花·女 头饰"}]}, {"g": "沧南旧影", "items": [{"f": "cn_m_cloth.glb", "label": "沧南旧影·男 衣服"}, {"f": "cn_m_head.glb", "label": "沧南旧影·男 头饰"}, {"f": "cn_f_cloth.glb", "label": "沧南旧影·女 衣服"}, {"f": "cn_f_head.glb", "label": "沧南旧影·女 头饰"}]}, {"g": "幻夜星轮背包", "items": [{"f": "star_m_worn.glb", "label": "幻夜星轮背包·男（佩戴实机）"}, {"f": "star_f_worn.glb", "label": "幻夜星轮背包·女（佩戴实机）"}, {"f": "bag_m.glb", "label": "幻夜星轮背包·男（单件白模）"}, {"f": "bag_f.glb", "label": "幻夜星轮背包·女（单件白模）"}]}, {"g": "其他外观（背包 / 武器皮肤）", "items": [{"f": "wubeixia.glb", "label": "武备匣背包（行26835 · 2906 顶点）"}, {"label": "武器模型 38 款（近似渲染）—— 打开「斩神联动 · 武器模型」", "href": "weapon_models.html"}]}];;;;;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setClearColor(0x0e1014, 1);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1a1c22, 1.35));
const k1 = new THREE.DirectionalLight(0xfff2e0, 2.1); k1.position.set(4,7,6); scene.add(k1);
const k2 = new THREE.DirectionalLight(0x88aaff, 1.15); k2.position.set(-6,3,-5); scene.add(k2);
const k3 = new THREE.DirectionalLight(0xffc070, 0.7); k3.position.set(-2,-4,4); scene.add(k3);
const grid = new THREE.GridHelper(24, 24, 0x2a3140, 0x1b1f26); grid.position.y = -1; scene.add(grid);

const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 2000);
let target = new THREE.Vector3(0,0,0), dist = 30, theta = 0.35, phi = 1.35, cur = null;
// 视角参数：?view=back|front|left|right（默认 front-ish）
(function(){
  const v = new URLSearchParams(location.search).get('view');
  if (v === 'back'){ theta = Math.PI; phi = 1.35; }
  else if (v === 'front'){ theta = 0; phi = 1.35; }
  else if (v === 'left'){ theta = -Math.PI/2; phi = 1.35; }
  else if (v === 'right'){ theta = Math.PI/2; phi = 1.35; }
})();

function fit(){
  const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
  cam.aspect = w / h;
  cam.position.set(target.x + dist*Math.sin(phi)*Math.sin(theta),
                   target.y + dist*Math.cos(phi),
                   target.z + dist*Math.sin(phi)*Math.cos(theta));
  cam.lookAt(target); cam.updateProjectionMatrix();
}
function render(){ renderer.setSize(canvas.clientWidth, canvas.clientHeight, false); fit(); renderer.render(scene, cam); }

function load(name, label){
  if (cur){ scene.remove(cur); cur = null; }
  document.getElementById('hud').textContent = label || '';
  new GLTFLoader().load('./assets/3d/zs3d/' + name, (g) => {
    const o = g.scene; o.rotation.x = Math.PI;
    o.traverse(n => { if (n.isMesh && n.material){
      const ms = Array.isArray(n.material)?n.material:[n.material];
      for (const mm of ms){ mm.side = THREE.DoubleSide;
        mm.color = new THREE.Color(0xc8ccd4); mm.roughness = 0.72; mm.metalness = 0.06;
        mm.needsUpdate = true; } } });
    scene.add(o); o.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(o);
    const c = box.getCenter(new THREE.Vector3()); o.position.sub(c);
    const s = box.getSize(new THREE.Vector3());
    const r = Math.max(s.x,s.y,s.z) * 0.62;
    target.set(0,0,0);
    // 竖屏手机留更大边距
    const portrait = canvas.clientWidth < canvas.clientHeight;
    dist = r / Math.tan((cam.fov*Math.PI/180)/2) * (portrait ? 1.85 : 1.45);
    cur = o; render(); window.__loaded = (window.__loaded||0)+1;
  }, undefined, (e)=>{ window.__err = String(e); });
}

// 侧栏
const list = document.getElementById('list');
const body = document.body;
let first = null;
for (const g of GROUPS){
  const h = document.createElement('h3'); h.textContent = g.g; list.appendChild(h);
  for (const it of g.items){
    const d = document.createElement('div'); d.className = 'it'; d.textContent = it.label;
    if (it.href){
      d.classList.add('ext');
      d.onclick = () => { window.location.href = it.href; };
    } else {
      d.onclick = () => { [...list.querySelectorAll('.it')].forEach(x=>x.classList.remove('on'));
                          d.classList.add('on'); load(it.f, it.label);
                          if (window.innerWidth <= 820) body.classList.remove('nav'); };
    }
    list.appendChild(d);
    if (!first && !it.href) first = {d, it};
  }
}
// ?i=N 直接选第 N 项（跨分组连续编号）—— 用于无头截图/分享直链
(function(){
  const _all = [];
  for (const g of GROUPS) for (const it of (g.items||[])) _all.push(it);
  const _i = parseInt(new URLSearchParams(location.search).get('i') || '-1', 10);
  if (_i >= 0 && _i < _all.length){
    const _t = _all[_i];
    [...list.querySelectorAll('.it')].forEach(x=>{ if(x.textContent===_t.label) x.classList.add('on'); });
    if (_t.href) { location.href = _t.href; return; }
    load(_t.f, _t.label);
    return;
  }
  if (first){ first.d.classList.add('on'); load(first.it.f, first.it.label); }
})();

document.getElementById('burger').onclick = () => body.classList.toggle('nav');
document.getElementById('mask').onclick = () => body.classList.remove('nav');

// 交互：鼠标 + 触摸
let drag = false, px = 0, py = 0, btn = 0;
canvas.addEventListener('mousedown', e => { drag = true; px = e.clientX; py = e.clientY; btn = e.button; });
window.addEventListener('mouseup', () => drag = false);
window.addEventListener('mousemove', e => {
  if (!drag) return;
  const dx = e.clientX - px, dy = e.clientY - py; px = e.clientX; py = e.clientY;
  if (btn === 2){ target.x -= dx * dist * 0.0015; target.y += dy * dist * 0.0015; }
  else { theta -= dx * 0.008; phi = Math.max(0.15, Math.min(3.0, phi - dy * 0.008)); }
  render();
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { e.preventDefault(); dist *= (1 + Math.sign(e.deltaY)*0.1); render(); }, {passive:false});

// 触摸：单指旋转 / 双指缩放
let tPrev = null, pinch = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1){ tPrev = {x:e.touches[0].clientX, y:e.touches[0].clientY}; pinch = 0; }
  else if (e.touches.length === 2){
    pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                       e.touches[0].clientY - e.touches[1].clientY);
    tPrev = null;
  }
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && tPrev){
    const dx = e.touches[0].clientX - tPrev.x, dy = e.touches[0].clientY - tPrev.y;
    tPrev = {x:e.touches[0].clientX, y:e.touches[0].clientY};
    theta -= dx * 0.010; phi = Math.max(0.15, Math.min(3.0, phi - dy * 0.010));
    render();
  } else if (e.touches.length === 2 && pinch){
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY);
    if (d > 0){ dist *= pinch / d; pinch = d; render(); }
  }
}, {passive:false});
canvas.addEventListener('touchend', () => { tPrev = null; pinch = 0; });

let rt = null;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 120); });
window.addEventListener('orientationchange', () => setTimeout(render, 260));
render();
window.addEventListener('load', render);
</script></body></html>
