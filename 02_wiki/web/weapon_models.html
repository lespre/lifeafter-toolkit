<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>斩神联动 · 武器模型（近似渲染）</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e13;color:#e8eaf0;font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}
  #bar{padding:9px 14px;background:#0d1a22;border-bottom:1px solid #1d3340}
  #bar b{color:#ffe578} #bar .warn{color:#ffb3b3;font-size:12.5px} #bar .s{color:#8b93a5;font-size:12px}
  select{background:#1b3a4a;color:#dfe7ee;border:1px solid #2c5a72;border-radius:6px;padding:4px 10px;font-size:13px}
  #cv{display:block;width:100%;height:calc(100vh - 118px)}
  #hud{position:fixed;right:14px;top:78px;font:12px/1.5 Consolas,monospace;color:#8fd0ff;background:#0d1a22cc;padding:8px 10px;border:1px solid #1d3340;border-radius:6px;white-space:pre}
</style>
</head>
<body>
<div id="bar">
  <a href="index.html" style="color:#7dd3fc;text-decoration:none;margin-right:12px">← 返回主页</a><b>斩神联动 · 武器模型（近似渲染）</b>
  <select id="sel"></select>
  <span class="s">authority=user_authorized_approximate_20260925</span>
  <div class="s" id="src"></div>
  <div class="warn">⚠ 几何与 IBL 环境球为**源资产**；配色为**演示近似**（奇迹的橙红/金黄取自包内 c159 染色参数；星辰刀无染色参数，按主题设定）。
    <b>非源 shader 复原，不冒充源级结论。</b></div>
</div>
<canvas id="cv"></canvas>
<div id="hud"></div>
<script type="module">
import * as THREE from './assets/vendor/three/three.module.min.js';
import { GLTFLoader } from './assets/vendor/three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from './assets/vendor/three/addons/controls/OrbitControls.js';

const SKINS = [
  { sid: '1110186', title: '星辰刀', glb: './assets/3d/weapon_skin/1110186/model.glb',
    cube: './assets/3d/weapon_skin/1110186/src_cube/faces/character_envmap_metal_01_f',
    color: 0x2f3944, emissive: 0x1a8fb5, emis: 0.18, rough: 0.30, metal: 0.92, env: 1.25,
    src: '0058.gpk 条目 row 64706（LOD0）· 422 顶点 / 481 面 / 1 submesh · skin_2003_031 · 斩神联动刀皮',
    basis: '无 c159 染色参数 ⇒ 配色按「星辰」主题设定（演示）' },
  { sid: '1110185', title: '奇迹', glb: './assets/3d/weapon_skin/1110185/model.glb',
    cube: './assets/3d/weapon_skin/1110186/src_cube/faces/character_envmap_metal_01_f',
    color: 0xdb3c10, emissive: 0xffae00, emis: 0.30, rough: 0.34, metal: 0.85, env: 1.35,
    src: '0058.gpk 条目 row 64686（LOD0，= 帧 386）· 7612 顶点 / 9204 面 / 8 submesh · skin_1007_011 · 斩神联动弓箭皮',
    basis: '★ 包内 c159 染色参数 #DB3C10（橙红）/ #FFAE00（金黄）—— 源证据，非我设定' },
];

const canvas = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
const q0 = new URLSearchParams(location.search);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = parseFloat(q0.get('exp') || '0.72');
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e13);
const camera = new THREE.PerspectiveCamera(26, 1, 0.01, 5000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
const hud = document.getElementById('hud');
const loader = new THREE.TextureLoader();
let root = null, cur = null;

function loadSkin(s) {
  if (root) { scene.remove(root); root = null; }
  cur = s;
  document.getElementById('src').textContent = s.src + ' ｜ 配色依据：' + s.basis;
  const envMap = new THREE.CubeTextureLoader().setPath('')
    .load([0, 1, 2, 3, 4, 5].map(i => s.cube + i + '_m0.png'));
  envMap.colorSpace = THREE.SRGBColorSpace;

  new GLTFLoader().load(s.glb, (gltf) => {
    root = gltf.scene;
    let nv = 0, nf = 0, nsub = 0;
    root.traverse(o => {
      if (o.isMesh) {
        nsub++;
        if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
        o.material = new THREE.MeshStandardMaterial({
          color: s.color, roughness: s.rough, metalness: s.metal,
          emissive: s.emissive, emissiveIntensity: s.emis,
          envMap: envMap, envMapIntensity: s.env,
          side: THREE.DoubleSide,
        });
        nv += o.geometry.attributes.position.count;
        nf += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
      }
    });
    scene.add(root);
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
    root.position.sub(ctr);
    const radius = Math.max(size.length() * 0.5, 0.01);
    camera.near = radius / 1000; camera.far = radius * 100;
    controls.minDistance = radius * 0.2; controls.maxDistance = radius * 8;
    const yaw = parseFloat(q0.get('yaw') || '75') * Math.PI / 180;
    const pitch = parseFloat(q0.get('pitch') || '8') * Math.PI / 180;
    const dist = radius * parseFloat(q0.get('zoom') || '1.25');
    camera.position.set(dist * Math.cos(pitch) * Math.sin(yaw), dist * Math.sin(pitch), dist * Math.cos(pitch) * Math.cos(yaw));
    camera.updateProjectionMatrix();
    controls.target.set(0, 0, 0); controls.update();
    hud.textContent = 'sid ' + s.sid + ' ' + s.title + '\nverts ' + nv + '\nfaces ' + Math.round(nf) +
                      '\nmeshes ' + nsub + '\nradius ' + radius.toFixed(3) + '\nchain user_authorized_approximate';
    document.title = 'READY ' + s.sid;
    window.__ready = true;
  }, undefined, (e) => { hud.textContent = 'LOAD ERROR: ' + e; window.__err = String(e); document.title = 'ERR'; });
}

const sel = document.getElementById('sel');
SKINS.forEach((s, i) => { const o = document.createElement('option'); o.value = i; o.textContent = s.title + '（' + s.sid + '）'; sel.appendChild(o); });
sel.onchange = () => loadSkin(SKINS[+sel.value]);
const idx = Math.max(0, SKINS.findIndex(s => s.sid === (q0.get('sid') || '1110186')));
sel.value = String(idx);
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (w && h) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
}
window.addEventListener('resize', resize);
resize();
loadSkin(SKINS[idx]);
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
