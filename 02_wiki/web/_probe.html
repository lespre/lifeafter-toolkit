<!DOCTYPE html><html><body>
<iframe id="f" src="board.html?b=avatar_catalog&p=1792690693" style="width:1200px;height:800px"></iframe>
<pre id="out">waiting</pre>
<script>
document.getElementById('f').addEventListener('load', function(){
  setTimeout(function(){
    try{
      var d=this.contentDocument;
      var g=d.getElementById('grid');
      var cs=g?getComputedStyle(g):null;
      var card=d.querySelector('.i');
      var cs2=card?getComputedStyle(card):null;
      document.getElementById('out').textContent = JSON.stringify({
        gridCols: cs?cs.gridTemplateColumns:null,
        gridDisplay: cs?cs.display:null,
        gridWidth: cs?cs.width:null,
        cardWidth: cs2?cs2.width:null,
        cardCount: d.querySelectorAll('.i').length
      }, null, 1);
    }catch(e){ document.getElementById('out').textContent='ERR '+e; }
  }.bind(this), 1200);
});
</script>
</body></html>
