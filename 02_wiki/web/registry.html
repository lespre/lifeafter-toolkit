<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时装全量登记表 · 明日之后资料档案馆</title>
<style>
:root{--bg:#0c0b0a;--panel:#171310;--ink:#f0eae4;--ink-2:#bdb0a4;--ink-3:#8c7d70;
--line:#2b231d;--line-2:#3d3128;--steel:#d14b32;--gold:#e0a83f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;font-size:13px;line-height:1.6;color:var(--ink);
background:radial-gradient(900px 420px at 18% -10%,rgba(111,159,186,.13),transparent 62%),
radial-gradient(700px 360px at 86% -6%,rgba(160,29,26,.10),transparent 66%),
linear-gradient(180deg,#0d151a,#0b1116 55%,#080d11);background-attachment:fixed;min-height:100vh;padding:24px 20px 60px}
.wrap{max-width:1180px;margin:0 auto}
.top{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}
.top h1{font-size:20px;letter-spacing:.06em}
.top a{margin-left:auto;color:var(--ink-3);text-decoration:none;border:1px solid var(--line-2);padding:5px 12px;border-radius:2px}
.top a:hover{color:var(--gold);border-color:var(--gold)}
.sub{color:var(--ink-3);font-size:12px;margin-bottom:14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px}
input,select{background:var(--panel);border:1px solid var(--line-2);color:var(--ink);padding:7px 10px;border-radius:2px;font-size:13px}
input{flex:1;min-width:240px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line-2);border-radius:2px;padding:12px 14px}
.card h3{font-size:14px;margin-bottom:6px}
.tag{display:inline-block;font-size:11px;color:var(--gold);border:1px solid rgba(224,168,63,.4);border-radius:2px;padding:0 6px;margin-right:6px}
.kv{color:var(--ink-2);font-size:12px}
.kv b{color:var(--ink-3);font-weight:400}
.desc{color:var(--ink-3);font-size:12px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{text-align:center;margin:18px 0}
button{background:var(--panel);border:1px solid var(--line-2);color:var(--ink-2);padding:8px 20px;border-radius:2px;cursor:pointer}
button:hover{color:var(--gold);border-color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>时装全量登记表</h1><a href="wiki.html">← 返回图鉴</a></div>
  <div class="sub" id="sub">加载中…</div>
  <div class="bar">
    <input id="q" placeholder="搜索：基名 / model_id / 部位 / 描述">
    <select id="part"><option value="">全部部位</option></select>
    <select id="table"><option value="">全部来源表</option></select>
  </div>
  <div class="grid" id="grid"></div>
  <div class="more"><button id="more">加载更多</button></div>
</div>
<script>
let ROWS=[],CARDS=[],limit=120,q='',fp='',ft='';
fetch('data/fashion_registry.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  ROWS=d.rows;CARDS=d.cards;
  document.getElementById('sub').textContent=
    `登记行 ${d.row_count} ｜ 套装卡 ${d.card_count} ｜ 来源：fashion_data + player_appear_data + simple_fashion_data`;
  const parts=new Set(),tabs=new Set();
  ROWS.forEach(r=>{if(r.part)parts.add(r.part);tabs.add(r.table)});
  parts.forEach(p=>document.getElementById('part').append(new Option(p,p)));
  tabs.forEach(t=>document.getElementById('table').append(new Option(t,t)));
  render();
}).catch(e=>{document.getElementById('sub').textContent='加载失败：'+e.message});

function render(){
  const g=document.getElementById('grid');
  const rows=ROWS.filter(r=>
    (!fp||r.part===fp)&&(!ft||r.table===ft)&&
    (!q||(r.base+r.name+r.desc+String(r.model_id)).toLowerCase().includes(q)));
  g.innerHTML='';
  rows.slice(0,limit).forEach(r=>{
    const el=document.createElement('div');el.className='card';
    el.innerHTML=`<h3>${r.name}</h3>
      <div class="kv">${r.part?`<span class="tag">${r.part}</span>`:''}
      <b>model</b> ${r.model_id??'—'} ｜ <b>品级</b> ${r.level??'—'} ｜ <b>魅力</b> ${r.charm??'—'}
      ｜ <b>表</b> ${r.table} ｜ <b>行键</b> ${r.key}</div>
      ${r.desc?`<div class="desc">${r.desc}</div>`:''}`;
    g.appendChild(el);
  });
  document.getElementById('more').style.display=rows.length>limit?'inline-block':'none';
  document.getElementById('more').textContent=`加载更多（已显示 ${Math.min(limit,rows.length)} / ${rows.length}）`;
}
document.getElementById('q').oninput=e=>{q=e.target.value.trim().toLowerCase();limit=120;render()};
document.getElementById('part').onchange=e=>{fp=e.target.value;limit=120;render()};
document.getElementById('table').onchange=e=>{ft=e.target.value;limit=120;render()};
document.getElementById('more').onclick=()=>{limit+=240;render()};
</script>
</body>
</html>
