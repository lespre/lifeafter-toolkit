<body class="wiki-board">
<aside id="siteNav" aria-label="资料分类"><div class="hd">资料分类</div></aside>
<header class="hd2">
  <div class="hd2-crumb">
    <a href="wiki.html">← 返回 Wiki 首页</a>
    <a href="index.html">三线状态</a>
  </div>
  <h1 id="title">加载中…</h1>
  <div class="meta-line" id="metaline"></div>
  <div class="pills" id="pills"></div>
</header>
<div class="wrap">
  <div class="controls">
    <input id="q" type="search" aria-label="搜索板内条目" placeholder="搜索名称 / ID / 任意字段…" autocomplete="off">
    <select id="fEv">
      <option value="">全部证据等级</option>
      <option value="structure">结构已解析</option>
      <option value="verified">业务链已核验</option>
      <option value="candidate">候选待验证</option>
    </select>
    <details class="board-filters" id="boardFilters" open><summary>筛选条件</summary><span id="fFashionWrap" style="display:none"></span></details>
    <select id="fRelease" style="display:none"><option value="">全部上架状态</option></select>
    <select id="fNameSt" style="display:none"><option value="">全部名称状态</option></select>
    <div id="fGrade" style="display:none;position:relative">
      <button type="button" id="fGradeBtn" aria-haspopup="listbox" aria-expanded="false" title="点击展开品级列表（可多选；一个都不勾 = 全部）"
        style="font:inherit;font-size:12px;color:#3f3f46;background:#fff;border:1px solid #e4e4e7;border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px">
        <span id="fGradeLabel">品级：全部</span><span style="color:#a1a1aa">▾</span>
      </button>
      <div id="fGradePanel" role="listbox" aria-multiselectable="true"
        style="display:none;position:absolute;top:calc(100% + 4px);left:0;width:max-content;min-width:200px;max-width:320px;max-height:290px;overflow:auto;background:#fff;border:1px solid #e4e4e7;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;z-index:60;box-sizing:border-box"></div>
    </div>
    <select id="fType" style="display:none"><option value="">全部武器种类</option></select>
    <select id="fIp" style="display:none"><option value="">全部联动IP</option></select>
    <span id="listingHint" class="sort-hint" style="display:none"></span>
    <span class="srv-sw" id="serverSwitch" style="display:none" aria-label="服别切换"></span>
    <span id="fCustomWrap"></span>
    <span id="sortHint" class="sort-hint" style="display:none"></span>
    <select id="fOrder" style="display:none" aria-label="排列依据">
      <option value="gallery">排序：游戏图鉴序列</option>
      <option value="id">排序：皮肤ID</option>
    </select>
    <button id="fDir" type="button" class="dir-btn" style="display:none" title="切换排列方向（↑/↓）" aria-label="切换排列方向">↓ 降序</button>
    <button id="fDensity" type="button" class="density-btn" aria-pressed="false"
      title="卡片密度：舒适＝大图 4 列／紧凑＝小图 5 列（选择会记住）">密度：舒适</button>
    <span class="count" id="count" role="status" aria-live="polite"></span>
  </div>
  <div class="notes" id="notes" style="display:none"></div>
  <div class="grid" id="grid"></div>
</div>
