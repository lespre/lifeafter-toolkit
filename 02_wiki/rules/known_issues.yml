    symptom: 1647 条目缺 provenance.source_id / steps[0].source_id / upstream.entry_index / upstream.file_id（契约错 6596）
    root_cause: 条目级溯源字段未按 frozen-v3 契约补齐（upstream 定位信息缺失）
    fix_path:
      - 在 build_equipment_attrs.py 产出时按 frozen-v3 契约写全 upstream.entry_index / file_id
      - source_id 需落在 equipment-attrs-kj1 / equipment-attrs-base 两个 lock 之一
    note: 另一处：source_locks[0].role 非法 1 条，需修 lock 声明

