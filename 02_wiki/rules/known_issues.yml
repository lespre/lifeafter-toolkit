# 已知问题登记（Known Issues）
# 每次重建前先看这里；修完一条就把 status 改成 fixed 并记入交接卡。
# 体检工具：python 02_wiki/web/tools/checks/gate_report.py
# 修复工具：python 02_wiki/web/tools/build/fix_provenance_contract.py --all [--apply]

fixed_issues:
  - id: KI-001
    board: talent_catalog
    status: fixed
    fixed_at: 2026-10-30
    symptom: 5304 条目全部缺 provenance.source_id 与 locator_chain.steps[0].source_id（契约错 10608）
    root_cause: >-
      板级 meta.provenance.source_locks 被改成两个 bytes=0/mtime=0 的假 lock
      （documents-py314-current-battle / -prof，无 path、非真实文件；无脚本产出，属临时手改），
      而条目级 provenance.source_id 仍是旧的单源 id「documents-py314-current」，
      与任一 lock 的 source_id 都不匹配 → strict_v2 判不合格。
    fix: >-
      align_package_lock：删除两个假 lock，恢复真实包级 lock（documents-py314-current，
      sha c9e12b43…，bytes 195840216，mtime 1792168962775981000，与 lottery_periods 同源），
      条目 source_id 与 steps[0].source_id 一并对齐。基础(new_talent_data) 与
      主题(theme_..._kj1) 两表同属 kj1 包 c9e12b，条目本就声明该 sha，无需拆双源。
    result: 契约错 10608 → 0

  - id: KI-002
    board: equipment_attrs
    status: fixed
    fixed_at: 2026-10-30
    symptom: 1647 条目缺 provenance.source_id / steps[0].source_id / upstream.entry_index / upstream.file_id（契约错 6596）
    root_cause: 条目级 source_id 停留在泛化 id「equipment-attrs」，未与自身声明的 source_lock_sha256 对应；缺 npk 定位层
    fix: >-
      align_lock_by_sha：按条目自身 source_lock_sha256 回推 source_id
      （694be043…→equipment-attrs-base / 52500238…→equipment-attrs-kj1），
      并按 server_branch 补**表级** npk 定位（file_id + entry_index，取自
      30_分析/tI扫描_20260927/ti_paths_all.jsonl：经典服 1F8E9684E1B97CE0:13283 /
      kj1 3D123F2BEE73ED47:6407）。另修 lock role「primary-frozen-extract」→「primary」，
      6 条 trial-unmatched 状态标签归一为 unresolved。
    result: 契约错 6596 → 0

  - id: KI-003
    board: drone_catalog
    status: fixed
    fixed_at: 2026-10-30
    symptom: 238/287 条目整块缺 provenance（locator_chain / upstream / source_lock_sha256）
    root_cause: 这些条目来自 CBG 静态导出（只有 name/desc/icon/level），本就没有行级解码溯源
    fix: >-
      roster_channel：契约新增「名册级通道」（2026-10-30 用户决策），
      条目写 provenance.roster（evidence=static-export + source_id + 来源描述 + 原标签留档），
      status_tags 归一为 unverified，页面以虚线琥珀标签「名册级」与行级条目区分。
    result: 契约错 2142 → 0

  - id: KI-004
    board: gene_potential_catalog
    status: fixed
    fixed_at: 2026-10-30
    symptom: 56/104 条目整块缺 provenance
    root_cause: 经典服字符串池名册级证据（无行级解码）
    fix: roster_channel（evidence=name-roster-only），同 KI-003
    result: 契约错 504 → 0

  - id: KI-005
    board: fashion_wardrobe
    status: fixed
    fixed_at: 2026-10-30
    symptom: 39/2899 条目缺 provenance（含 name_source）
    root_cause: 捏脸预设条目来自另一张表（fashion_preset_do_face_config_data），该源未登记进板级 locks
    fix: >-
      stamp_partial：新增表级 lock（source_id=face-preset-fashion_preset_do_face_config_data，
      sha 取自还原树同名文件真实摘要，path/bytes/mtime 同源），补齐 locator_chain
      （kind=decoded-table-row + table + row_key + field_refs）、name_source 与 upstream 表级定位。
    result: 契约错 195 → 0

open_issues:
  - id: KI-006
    board: 全部板
    blocking: false
    status: fixed
    fixed_at: 2026-10-30
    symptom: 无编排器 —— 板级重建顺序仅存在于脚本命名与聊天记录
    root_cause: 没有 pipeline.yml 级别的可执行执行图
    fix: >-
      新增 **rules/pipeline_graph.yml**（手工维护层，编排器唯一执行来源）+ 编排器
      build_pipeline.py。每条 step 强制声明 order_basis（为何排此位）与 source（依据出处）；
      依据等级 documented / inferred / unknown 三档，未声明顺序的板默认不执行。
      编排器串联：灰度快照 → 主产出 → 后处理 → 溯源契约修复 pass → 发布门禁 → 条目级 diff → 更新日志草稿。
      默认 dry-run，--apply 才落盘，--resume 续跑。
    result: >-
      编排器可用并通过实跑验证；执行图覆盖 2 块板（vehicle_full 完整 7 步、fashion_wardrobe 2 步），
      其余 47 块顺序待人工判定（--check 会列为待补，不臆造）。

  - id: KI-007
    board: 入口
    blocking: false
    symptom: 页面入口 wiki.html / board.html / index.html 三份，缺统一索引与版本一致性展示
    root_cause: 历史上分批建设
    fix_path: 方案 A 阶段统一入口样式与构建版本标识（build_meta.js 已存在，门户未统一展示）

  - id: KI-008
    board: 全部板
    blocking: false
    status: fixed
    fixed_at: 2026-10-30
    symptom: 溯源修复靠「规则文件 + 专用工具」执行，未接入主构建编排
    root_cause: 修复器 fix_provenance_contract.py 目前独立运行（dry-run 默认，--apply 落盘）
    fix: >-
      修复器作为构建流程的固定 pass 接入编排器（执行图 stages.contract_fix，
      跑 fix_provenance_contract.py --all --apply），与门禁、diff 串在同一次 run 里。
      diff 报告的「口径变更 / 数据变更」分列已生效（规则层指纹纳入快照 meta）。
    result: 修复器随流水线自动执行；口径变更与数据变更分列呈现

contract_changes:
  - date: 2026-10-30
    file: web/tools/publication_policy.py
    change: >-
      新增「名册级通道」：条目 provenance.roster 具备 evidence∈{name-roster-only, static-export}
      + source_id + source_desc 时，免除行级 locator_chain / table / row_key / field_refs /
      name_source / upstream / source_lock_sha256 要求；仍强制 status_tags 合法且必须含 unverified。
      allowed_tags 增加 unverified。
    authority: 用户决策（2026-10-30 问答）
    note: 该通道只放宽「公开资格」，不改变数据本身；页面已加名册级视觉区分

  - date: 2026-10-30
    file: rules/pipeline_graph.yml（新建）
    change: >-
      新增板级重建执行图（手工维护层）：阶段主干 + 跨板脚本 + 逐板有序步骤，
      每步声明 order_basis（为何排此位）与 source（依据出处），依据等级分 documented / inferred / unknown。
    authority: agent 判定（依据脚本 docstring 与源码取值逻辑）
    note: >-
      执行图是编排器唯一执行来源。rules/boards/*.yml 的 primary_builders / postprocess_scripts
      是**角色分类不是顺序**，实测 vehicle_full 7 个脚本里角色分类给出的顺序与真实顺序仅 1 处吻合。

  - date: 2026-10-30
    file: web/tools/notes_util.py（新建）+ 4 个载具板脚本
    change: >-
      meta.notes 改为**幂等追加**（append_note / replace_note / dedupe_notes）。
      原写法是无条件字符串拼接，每跑一次重建脚本就多一段说明。
    authority: agent 判定（编排器实跑重跑校验时暴露）
    note: >-
      实测 vehicle_full 的 notes 累积到 31 段、单段重复 8 次 ⇒ 产物噪声无界增长、
      **幂等性永不成立**（重跑后文件哈希必变，条目级 diff 每次都报「修改」，
      灰度回滚判据随之失效）。收敛后 notes 稳定 5 段，连续两次重跑哈希一致。

fixed_issues_extra:
  - id: KI-009
    board: 载具板（vehicle_full）
    status: fixed
    fixed_at: 2026-10-30
    symptom: 编排器按执行图重跑后 perks / modding_levels 逐轮缩水（16 条 → 3 条）
    root_cause: >-
      build_vehicle_lore.py 的 vids 取值顺序是 `it["vehicle_ids"] or [it["vehicle_id"]]` ——
      优先读 merge_vehicle_cards.py 产出的 vehicle_ids。原执行图把 lore 排在 merge 之前，
      lore 拿不到合并后的 vehicle_ids ⇒ 特技/描述按变体归并时漏掉其余变体。
    fix: >-
      执行图顺序修正为 params → merge_vehicle_cards → lore（merge 提到 lore 之前），
      并在 order_basis 里写明源码依据行。
    result: 连续两次重跑产物哈希一致（686088e15fea53d5），条目级 0 变化

  - id: KI-010
    board: 工具（diff_boards.py）
    status: fixed
    fixed_at: 2026-10-30
    symptom: >-
      diff_boards.py 三个缺陷：① 无变更时 render_md 读不存在的 report["boards"] → KeyError 崩；
      ② 比对范围取两边并集 → 只拍 1 块板的快照被判成「新增 22 万条」；
      ③ after=current 时不返回规则层指纹 → 快照里 61 个规则文件全被误判「删除」。
    root_cause: 三个缺陷都在「对比范围与元信息装配」这一层，写的时候没做边界场景
    fix: >-
      ① 判空对象改 boards_detail；② 比对范围改为 快照 ∩ 现产物，未覆盖板单列说明；
      ③ load_after 补 rules_fingerprint。
    result: 实测 diff 输出「对比板数 1 / 修改 1 条 / 规则层无变化」，可精确到字段（veh_193000 — name）

