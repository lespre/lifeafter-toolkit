# 已知问题登记（Known Issues）
# 每次重建前先看这里；修完一条就把 status 改成 fixed 并记入交接卡。
# 体检工具：python 02_wiki/web/tools/checks/gate_report.py

open_issues:
  - id: KI-001
    board: talent_catalog
    blocking: true
    symptom: 5304 条目全部缺 provenance.source_id 与 locator_chain.steps[0].source_id（契约错 10608）
    root_cause: >-
      板级 meta.provenance.source_locks 已从单源拆为双源
      （documents-py314-current-battle / -prof），
      但条目级 provenance.source_id 与 steps[0].source_id 仍是旧 id「documents-py314-current」，
      与任一 lock 的 source_id 都不匹配 → strict_v2 判不合格。
      即：meta 拆源后没同步到条目层。
    fix_path:
      - 按条目所属表（battle 侧 new_talent_data 行 vs prof 侧表）把 source_id 映射到对应新 lock id
      - 同步 locator_chain.steps[0].source_id 与 source_lock_sha256
      - 映射必须在产物脚本里做（build_talent_by_prof.py / merge_talent_boards.py），不得手改 json
    note: 禁止为了让门禁变绿而把 source_id 统一填成某一个 lock id —— 那是伪造溯源。

  - id: KI-002
