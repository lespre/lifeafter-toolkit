# ══════════════════════════════════════════════════════════════════════════
# render3d.yml — 时装 / 武器皮肤 3D 资产流水线契约
#   方针 + 口径 + 可复算规则 + 阶段图，脚本只读不写，禁止任何生成器覆盖。
#
#   定位：这条线是「资产生产线」，不是「板级重建」。因此**不并入**
#   rules/pipeline_graph.yml 的板级 stages（那是人工判定的重建顺序，
#   语义不同）；CLI 约定与其对齐（--apply dry-run / --stage / --check / 0-1-2）。
#   将来若要发布成板，另按四层登记：taxonomy → 板产物 meta.category →
#   rules/boards/*.yml → manifest.js，并过 strict_v2 门禁。
#
#   建立：2026-11-07　依据：报告_3D渲染研究_时装与武器皮肤_20261102.md
#         ＋ 皮肤渲染定位链_可复用流程_v1.md（v1-draft，只作路线图）
# ══════════════════════════════════════════════════════════════════════════
version: 1
maintained_by: human
generated_by: null

# ── 方针 ───────────────────────────────────────────────────────────────────
policy:
  goal: >
    把 3D 线从「散落的一次性研究脚本」变成「可幂等重跑、有契约、有质检、
    有证据、能被编排调度的资产流水线」；先如实复现既有成果，再谈扩量与保真。
  boundary: >
    本轮只做 roster → export → verify 三段资产生产。不发布成板、不进主站导航、
    不修改任何生产默认文件（weapon_skin_viewer.js / fashion3d.html / manifest.js
    / data/media/weapon_skin_media.js 全部只读）。
  non_goals:
    - 不追求 100% 保真（IBL cube / 第二 UV / uber_fx / .gim 骨骼 / .sfx 本体仍未解）
    - 不注入游戏进程、不扫线上 npk（全程静态离线）
    - 不把 approximate 包装成 source_matched
  principles:
    - 数据源白名单之外一律不读；拿不到证据标 unresolved 并写报告，绝不伪造
    - 选型规则必须可复算，并先过 golden_set 全量一致率验证才允许扩量
    - 默认 dry-run，--apply 才落盘；先算差异，一致则不写（字节级幂等）
    - 缺源标 missing，不用别的图/别的部件顶替
    - 任何为好看而调的数值标 approximate，留待用户批准
    - 回归不得破坏已建成皮肤（既有 5 套为冻结基准）

# ── 数据源边界（用户铁律）────────────────────────────────────────────────
data_sources:
  allow:
    - 01_索引与产物/41_还原树/pe/资源      # mesh / mtg / ktx / c159 / gim
    - 01_索引与产物/30_分析/_fashion3d      # 冻结索引与普查产物
    - 02_wiki/web/assets/3d                # 既有产物（只读对照基准）
  forbid:
    - 线上 / 远程 npk
    - 客户端进程注入
    - 任何未在 allow 中的路径（写死设备路径亦禁）
  note: >
    路径一律经 la_paths 派生，脚本内不得出现 E:/ 或 e:\ 字面量。
    溯源字面量（source_locks.sha256/path）若将来写进板产物，必须保持字面量；
    本流水线的 roster / manifest 属运行态校验，sha256 实时计算，两者不混。

# ── 保真分级（沿用 11-02 报告既有口径，不新造）──────────────────────────
fidelity:
  levels: [source_matched, source_candidate, approximate, unresolved]
  default: approximate
  rule: >
    source_matched = 材质参数逐项有 c159/mtg 源值且查看器消费；
    source_candidate = 有源候选但未逐值配对；
    approximate = PBR 由 .mtg 材料/贴图直出，IBL 为程序化 studio、
    detail normal 按同 UV 近似合并、第二 UV 集与 uber_fx 逐层参数未进 GLB；
    unresolved = 源缺失或语义未定证，fail-closed 不出图。
  known_gaps:
    - IBL cube：common/env_map 在还原树确认不存在，磁盘 .cube 采样 0 命中
    - 材质级 u_cube_brightness / u_rotate_angle 生产链未消费
    - 作者 mip(8级) / u_lightmap_factor / u_env_day2night_exposure 未取或硬编
    - .mtg RenderStates、TransparentMode 逐值统计（unresolved）
    - .gim 骨骼挂接、.sfx 特效本体、切线手性（不导出 TANGENT）
    - ★ .gim 几何缺口（2026-11-07 修正理解）：.gim 与 .c159 同格式（magic c1 59 41 0d），
      本质是 NeoX「对象/场景描述符」——字段名表 + 带 tag 值流 + 引用串（指向子件/LOD/
      材质/挂点的 .gim/.mesh/.mtg）。绝大多数 .gim 是装配图，几何体在同級或外部 .mesh；
      仅极少数大文件（如 players/r_m_1000，672KB）内嵌顶点缓冲。
      ⇒ suit_f_3007_eu 的「几何体缺件」已证伪：其 .gim 引用
      `character\players\suit_f_3007\suit_f_3007.mesh`（194KB 合法 .mesh，存在于树内），
      r3d_core.resolve_mesh 现已通过 r3d_gim 跨目录解析该引用，3007_f 由 unresolved 升为 ready。
      全量 survey 已从 1253 ready / 1 unresolved 变为 1254 ready / 0 unresolved。
      r3d_gim.py 已落地（解析描述符 + 抽取引用 + 探测内嵌几何候选），内嵌几何的完整抽取
      （blob 步长/分量解析）为后续子任务，且大文件多位于 fashion/weapon 根之外。

# ── 阶段图（书写顺序 = 执行顺序）────────────────────────────────────────
stages:
  - id: roster
    tool: s1_roster.py
    input: [fashion_index.json, render3d.yml, 41_还原树/pe/资源]
    output: 02_wiki/state/render3d/roster.json
    gate: >-
      每个 unit 的 mesh 须通过魔数校验（44 字节 _shadow 桩/坏魔数剔除），
      同级无合法 .mesh 且有 .gim → 标 unresolved_geometry_format；
      mesh 缺失 → 标 missing（几何不在，无法出图）；
      .mtg（基础材质）缺失但 mesh 在 → 按 white_model 政策标 ready 出白模
      （用户 2026-11-07 决策：放行白模，几何可见、无贴图；不顶替变体材质）。
  - id: export
    tool: s2_export.py
    input: [roster.json, fashion_glb.py（动态加载，覆写路径常量）]
    output: 02_wiki/state/render3d/staging/<outfit_id>/
    gate: staging 与既有产物逐文件 sha256 比较，一致即跳过；--apply 才替换
  - id: verify
    tool: s3_verify.py
    input: [roster.json, staging/, assets/3d/fashion_3d/]
    output: 02_wiki/state/render3d/verify_report.json
    gate: golden_set 一致率 5/5、GLB 头合法、无空件、missing[] 为空、复跑幂等
  - id: report
    tool: run_pipeline.py
    input: [verify_report.json]
    output: 02_wiki/state/render3d/pipeline_report.json
    gate: 退出码 0 才算通过；1 质检失败；2 规则/参数错误

# ── 第二条线：武器皮肤（复用同套 r3d_core machinery，只读生产产物）────────
#   武器资产已建成（assets/3d/weapon_skin/ 379 GLB），本线只做质检+溯源基线，
#   不重建（重建属 build_weapon_glb.py 包装，留待后续阶段）。
#   已知：目录名(1110013) 与 c159 普查 skin_freq 键(skin_1007_007) 不同体系，
#        无映射 ⇒ 源证据默认 unresolved，不伪造。
weapon_stages:
  - id: weapon_inventory
    tool: w1_inventory.py
    input: [assets/3d/weapon_skin/*/viewer.json, weapon_c159_material_survey.json]
    output: 02_wiki/state/render3d/weapon_inventory.json
    gate: 枚举全部皮肤目录；GLB 头校验；viewer 引用核对；源证据 best-effort，缺失标 unresolved
  - id: weapon_verify
    tool: w3_weapon_verify.py
    input: [weapon_inventory.json]
    output: 02_wiki/state/render3d/weapon_verify_report.json
    gate: GLB 非法/引用缺失/保真非法 ⇒ 红灯；无 viewer/溯源缺失/绝对路径 ⇒ 黄灯

# ── 描述符解码器（2026-11-07 新增，被 resolve_mesh 复用）─────────────────
#   r3d_gim.py：NeoX/c159 描述符（.gim/.c159）解析——字段名表 + 带 tag 值流 +
#   引用串抽取（子件 / LOD / 材质 / 挂点的 .gim/.mesh/.mtg）+ 内嵌几何候选探测。
#   只读，不写盘，纪律同 r3d_core（la_paths 派生、fail-closed、绝不伪造）。
#   用途：resolve_mesh 在候选为 .gim 或缺件时，解析同级 .gim 引用的外部 .mesh，
#   把「几何体为 .gim / 跨目录装配」从 unresolved 升级为 ready（已救回 3007_f）。
#   ⚠ 内嵌几何（大文件如 r_m_1000 的 89,640B 顶点缓冲）的完整抽取为后续子任务。

