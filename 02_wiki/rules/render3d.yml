# ── 索引 → 清单 的可复算选型规则（r3d_rules.py 实现，改这里必须同步改代码）
selection_rules:
  group_by: [series, gender]
  roots: [players2025, players2021]
  exclude_roots: [players]
  part_prefix: {b: body, h: hair, bag: bag, suit: suit}
  players2025_prefer: '_link 目录（全件合体）＞ 普通目录；同 prefix 取 tail 字典序最小'
  players2021_multi_mesh: >
    b_ 目录内若存在 <stem>_1.mesh 且有同名 .mtg ⇒ 追加 part_id=outer；
    若存在 h_<gender>_<series>.mesh 且无独立 h_ 目录 ⇒ 用它作 hair。
  fail_closed: '无法唯一判定 → status=unresolved，写报告，不猜不补'
  require_golden_agreement: 5

# ── 白模政策（2026-11-07 用户决策：放行白模）─────────────────────────────
#   实测：全量 survey 的「缺失 10 套」经逐套核验，9 套（311119_f / 311120_f /
#   3174_f / 3190_m / 326366_f / 3452_f / 3452_m / 3479_m / 3480_m）的 .mesh
#   基础几何全部存在且魔数合法，仅「基础 .mtg 材质」缺失（目录里只剩 LOD /
#   shadow / high 变体 .mtg，疑似部分基础件被改名）；1 套 6018_f 几何本身不全
#   （仅头发 high 几何、且唯一 .mtg 是阴影材质）→ 仍按 missing 跳过。
#   决策：几何在 + 基础材质缺 ⇒ 按白模渲染（默认白色 PBR，无贴图），让几何可见；
#         NOT 用变体材质顶替（口径未批准），也不伪造。
white_model:
  enabled: true
  # 几何本身不完整 / 只有阴影材质的套，仍按 missing 跳过，不顶替：
  exclude_units: [6018_f]
  material: {metallicFactor: 0.0, roughnessFactor: 0.75, baseColorFactor: [1, 1, 1, 1]}
  note: >
    白模由 s2_export 在流水线侧注入的 build_part 覆写实现（不修改共享
    fashion_glb.py）：基础 .mtg 缺失时，喂一个空 sets + 上述白色 mat_opts 给
    export_glb.build_glb，单 set 自动覆盖全部子网格。带 mtg 的套仍走原
    build_part，行为不变。s1_roster 仅在 mesh 在且单元未被 exclude 时把部件标
    ready 并记录 mtg_missing=true。

# ── 待用户判定（本轮不擅自定口径）──────────────────────────────────────
owner_decision_pending:
  - 3D 产物是「研究原型」还是「发布成板」：发布需 strict_v2 双源契约，当前只有单一来源
  - 是否把时装批跑从 5 套扩到 840 系列 / 1310 个可判定的 (series,gender) 组（实测：1264 可判定、46 unresolved、8 条跨容器串号按未证排除）
  - 保真目标：接受 approximate 铺量，还是先攻 source_matched
  - fashion3d.html / skin3d.html 是否进主站导航（涉及四层分类登记）
